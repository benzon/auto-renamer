[package]
name = "auto-renamer"
version = "1.0.0"
edition = "2021"
authors = ["BenZoN"]
description = "Auto Renamer watches a folder and renames new images"
license = "GPL-3.0-only"
publish = false
default-run = "auto-renamer"

[dependencies]
ffmpeg-sidecar = "2"
png = "0.17"
raw-window-handle = "0.6"
slint = { version = "1.14", features = ["raw-window-handle-06"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
windows = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_Com",
    "Win32_System_IO",
    "Win32_Networking_WinHttp",
    "Win32_System_LibraryLoader",
    "Win32_System_Registry",
    "Win32_System_SystemInformation",
    "Win32_System_SystemServices",
    "Win32_System_Threading",
    "Win32_UI_Controls",
    "Win32_UI_Shell",
    "Win32_UI_Shell_Common",
    "Win32_UI_WindowsAndMessaging",
] }

[build-dependencies]
slint-build = "1.14"
winresource = "0.1"
